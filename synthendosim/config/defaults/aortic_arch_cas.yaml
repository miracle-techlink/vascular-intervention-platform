name: SynthEndoSim-AorticArch-CAS-v1

anatomy:
  name: aortic_arch_cas
  # Override with your mesh path at runtime or via make_env(anatomy_mesh=...)
  mesh_path: ""
  insertion_point: [-23.0, -180.0, -15.0]
  insertion_direction: [0.0, 1.0, 0.0]
  target_point: [-31.7, 70.3, 11.6]   # LCCA ostium
  scale: [1.0, 1.0, 1.0]
  rotation_yzx_deg: [0.0, 0.0, 0.0]

device:
  kind: j_guidewire
  tip_angle: 0.21

reward:
  manifold_distance_weight: 1.0
  target_reached_bonus: 10.0
  step_penalty: -0.01
  target_threshold_mm: 10.0
  use_manifold: true

episode:
  max_steps: 300
  held_out_seeds: [1000, 1001, 1002, 1003, 1004]
